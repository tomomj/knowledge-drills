name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "agent/**"
      - ".dockerignore"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write

concurrency:
  group: backend-cd-cloud-run-main
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  BACKEND_SERVICE: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  wait-for-agent-eval:
    name: Wait for agent eval gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Skip gate for manual runs
        if: github.event_name != 'push'
        run: echo "workflow_dispatch runs bypass the agent eval gate."

      - name: Wait for Agent Eval on this commit
        if: github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const before = context.payload.before;

            // agent/ に差分がない push は eval 対象外なのでゲートを素通しする。
            // 差分判定に失敗した場合は安全側に倒してゲートを有効にする。
            let agentChanged = true;
            if (before && !/^0+$/.test(before)) {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${sha}`,
                });
                const files = data.files ?? [];
                agentChanged =
                  files.length >= 300 ||
                  files.some(
                    (file) =>
                      file.filename.startsWith("agent/") ||
                      file.filename === ".github/workflows/agent-eval.yml",
                  );
              } catch (error) {
                core.warning(`Failed to compare commits: ${error.message}`);
              }
            }

            if (!agentChanged) {
              core.info("No agent files changed; skipping the agent eval gate.");
              return;
            }

            const requiredChecks = [
              "Agent Eval (grading)",
              "Agent Eval (drill_generator)",
              "Agent Eval (failure_analysis)",
              "Agent Eval (document_patch)",
            ];

            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              const checkRuns = data.check_runs;

              const latestByName = new Map();
              for (const run of checkRuns) {
                if (!requiredChecks.includes(run.name)) {
                  continue;
                }
                const current = latestByName.get(run.name);
                const runStartedAt = new Date(run.started_at || run.created_at);
                const currentStartedAt = current
                  ? new Date(current.started_at || current.created_at)
                  : null;
                if (!current || runStartedAt > currentStartedAt) {
                  latestByName.set(run.name, run);
                }
              }

              const missing = requiredChecks.filter((name) => !latestByName.has(name));
              const pending = [];
              for (const name of requiredChecks) {
                const run = latestByName.get(name);
                if (!run) {
                  continue;
                }
                if (run.status !== "completed") {
                  pending.push(`${name}: ${run.status}`);
                  continue;
                }
                if (run.conclusion !== "success") {
                  core.setFailed(
                    `${name} finished with ${run.conclusion}; blocking backend deploy.`,
                  );
                  return;
                }
              }

              if (missing.length === 0 && pending.length === 0) {
                core.info(`Agent eval gate passed: ${requiredChecks.join(", ")}`);
                return;
              }

              core.info(
                `Waiting for agent eval. Missing: ${
                  missing.join(", ") || "none"
                }. Pending: ${pending.join(", ") || "none"}.`,
              );
              await new Promise((resolve) => setTimeout(resolve, 30_000));
            }

            core.setFailed(
              `Timed out waiting for agent eval: ${requiredChecks.join(", ")}`,
            );

  deploy-backend:
    name: Deploy backend to Cloud Run
    runs-on: ubuntu-latest
    needs: wait-for-agent-eval
    if: >-
      success() &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          required_vars=(
            PROJECT_ID
            REGION
            ARTIFACT_REPOSITORY
            BACKEND_SERVICE
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name}" ]]; then
              echo "::error::Repository variable ${var_name} is required."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Define image tag
        shell: bash
        run: |
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          echo "BACKEND_IMAGE=${registry}/backend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag "$BACKEND_IMAGE" .

      - name: Push backend image
        run: docker push "$BACKEND_IMAGE"

      - name: Deploy backend
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$BACKEND_IMAGE" \
            --quiet
