name: Agent Eval

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-eval.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: ADK eval profile to run
        required: true
        default: full
        type: choice
        options:
          - full
          - quick

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: agent-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
  GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GOOGLE_CLOUD_LOCATION: "us-central1"
  KNOWLEDGE_DRILL_AGENT_MODEL: "gemini-2.5-flash-lite"
  GCP_AGENT_EVAL_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_AGENT_EVAL_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_AGENT_EVAL_SERVICE_ACCOUNT: ${{ vars.GCP_AGENT_EVAL_SERVICE_ACCOUNT }}

jobs:
  wait-for-prerequisite-ci:
    name: Wait for prerequisite CI
    runs-on: ubuntu-latest
    outputs:
      should_run_eval: ${{ steps.manual.outputs.should_run_eval || steps.prerequisites.outputs.should_run_eval }}

    steps:
      - name: Skip prerequisite wait for manual runs
        id: manual
        if: github.event_name != 'pull_request'
        run: |
          echo "workflow_dispatch runs execute eval directly."
          echo "should_run_eval=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Backend and Frontend CI
        id: prerequisites
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const paths = files.map((file) => file.filename);

            const shouldRunEval = paths.some((path) => path.startsWith("agent/"));
            core.setOutput("should_run_eval", shouldRunEval ? "true" : "false");
            if (!shouldRunEval) {
              core.info("No agent files changed; skipping ADK eval.");
              return;
            }

            const requiresBackendCi = paths.some(
              (path) =>
                path.startsWith("backend/") ||
                path.startsWith("agent/") ||
                path === ".github/workflows/backend-ci.yml",
            );
            const requiresFrontendCi = paths.some(
              (path) =>
                path.startsWith("frontend/") ||
                path === ".github/workflows/frontend-ci.yml",
            );

            const requiredChecks = [];
            if (requiresBackendCi) {
              requiredChecks.push("Backend", "Agent");
            }
            if (requiresFrontendCi) {
              requiredChecks.push("Frontend");
            }

            if (requiredChecks.length === 0) {
              core.info("No prerequisite CI checks are expected for this pull request.");
              return;
            }

            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              const checkRuns = data.check_runs;

              const latestByName = new Map();
              for (const run of checkRuns) {
                if (!requiredChecks.includes(run.name)) {
                  continue;
                }
                const current = latestByName.get(run.name);
                const runStartedAt = new Date(run.started_at || run.created_at);
                const currentStartedAt = current
                  ? new Date(current.started_at || current.created_at)
                  : null;
                if (!current || runStartedAt > currentStartedAt) {
                  latestByName.set(run.name, run);
                }
              }

              const missing = requiredChecks.filter((name) => !latestByName.has(name));
              const pending = [];
              for (const name of requiredChecks) {
                const run = latestByName.get(name);
                if (!run) {
                  continue;
                }
                if (run.status !== "completed") {
                  pending.push(`${name}: ${run.status}`);
                  continue;
                }
                if (run.conclusion !== "success") {
                  core.setFailed(
                    `${name} prerequisite check finished with ${run.conclusion}; skipping agent eval.`,
                  );
                  return;
                }
              }

              if (missing.length === 0 && pending.length === 0) {
                core.info(`Prerequisite CI passed: ${requiredChecks.join(", ")}`);
                return;
              }

              core.info(
                `Waiting for prerequisite CI. Missing: ${
                  missing.join(", ") || "none"
                }. Pending: ${pending.join(", ") || "none"}.`,
              );
              await new Promise((resolve) => setTimeout(resolve, 30_000));
            }

            core.setFailed(
              `Timed out waiting for prerequisite CI: ${requiredChecks.join(", ")}`,
            );

  agent-eval:
    name: Agent Eval (${{ matrix.eval }})
    needs: wait-for-prerequisite-ci
    if: needs.wait-for-prerequisite-ci.outputs.should_run_eval == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        eval:
          - grading
          - drill_generator
          - failure_analysis
          - document_patch

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate eval configuration
        shell: bash
        run: |
          required_vars=(
            GOOGLE_CLOUD_PROJECT
            GOOGLE_CLOUD_LOCATION
            GCP_AGENT_EVAL_WORKLOAD_IDENTITY_PROVIDER
            GCP_AGENT_EVAL_SERVICE_ACCOUNT
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name}" ]]; then
              echo "::error::Repository variable ${var_name} is required."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_AGENT_EVAL_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_AGENT_EVAL_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        # v8 系はメジャーエイリアスタグが無いためパッチまで固定する
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Run ADK evals
        shell: bash
        run: |
          profile="${{ inputs.profile }}"
          if [[ -z "$profile" ]]; then
            profile="full"
          fi
          python scripts/run_adk_evals.py --profile "$profile" "${{ matrix.eval }}"
