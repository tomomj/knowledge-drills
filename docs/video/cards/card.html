<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1710px; height: 947px; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #0b3a36;
    color: #f4f7f6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 140px;
    position: relative;
  }
  .brand {
    position: absolute;
    top: 56px;
    left: 140px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 700;
    font-size: 30px;
    color: #d7e5e2;
  }
  .brand .mark {
    width: 44px; height: 44px;
    background: #12b886;
    color: #06211e;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
  }
  .step {
    font-size: 34px;
    font-weight: 700;
    color: #12b886;
    letter-spacing: 0.12em;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 84px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: 0.01em;
    margin-bottom: 30px;
    white-space: pre-line;
  }
  .sub {
    font-size: 40px;
    line-height: 1.6;
    color: #b9cfca;
    white-space: pre-line;
  }
  .accent { color: #2dd4a7; }
  .footer {
    position: absolute;
    bottom: 56px;
    left: 140px;
    font-size: 26px;
    color: #7fa39c;
  }
</style>
</head>
<body>
  <div class="brand"><div class="mark">K</div>Knowledge Drills</div>
  <div class="step" id="step"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="footer" id="footer"></div>
</body>
</html>
