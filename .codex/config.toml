# Project-local Codex configuration layer.
# Rules under .codex/rules/ are loaded only when this repository is trusted.

default_permissions = "knowledge-drills-worktree"

[permissions.knowledge-drills-worktree]
description = "Allow writes in this worktree while keeping .env files read-only."
extends = ":workspace"

[permissions.knowledge-drills-worktree.filesystem]
glob_scan_max_depth = 6

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
default_tools_approval_mode = "approve"
